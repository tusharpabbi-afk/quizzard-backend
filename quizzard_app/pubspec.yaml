name: quizzard_app
description: Quiz game with sound and haptics
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^5.2.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0 # For flying XP and smooth UI
  http: ^1.2.0
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.7.0
  firebase_storage: ^12.4.10
  image_picker: ^1.2.1
  firebase_core_web: ^2.24.0
  csv: ^6.0.0
  file_picker: ^10.3.10
  shared_preferences: ^2.5.4
  video_player: ^2.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/categories/